{% extends "base.html" %}
{% block title %}My account{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>My account</h1>
  <p class="muted">Username: <strong>{{ current_user.username }}</strong>{% if current_user.is_admin %} · admin{% endif %}</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Display name <input name="name" value="{{ current_user.name }}" required></label>
    <h2>Change password</h2>
    <label>Current password <input name="current" type="password" autocomplete="current-password"></label>
    <label>New password <input name="new" type="password" minlength="8" autocomplete="new-password"></label>
    <button class="primary">Save</button>
  </form>
  <p><a href="{{ url_for('main.player', user_id=current_user.id) }}">View my stats →</a></p>
</div>
{% endblock %}
