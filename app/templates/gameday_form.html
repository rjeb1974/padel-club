{% extends "base.html" %}
{% block title %}{{ 'Edit' if gd else 'New' }} game day{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>{{ 'Edit' if gd else 'New' }} game day</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Date <input type="date" name="date" required value="{{ (gd.date if gd else today).isoformat() }}"></label>
    <label>Location <input name="location" value="{{ gd.location if gd else '' }}" placeholder="Club / court"></label>
    <label>Notes <textarea name="notes" rows="3">{{ gd.notes if gd else '' }}</textarea></label>
    <button class="primary">Save</button>
  </form>
</div>
{% endblock %}
