{% extends "base.html" %}
{% block title %}Leaderboard{% endblock %}
{% block content %}
<h1>Leaderboard</h1>
<form method="get" class="filters">
  <label>Season
    <select name="year" onchange="this.form.submit()">
      <option value="">All time</option>
      {% for y in years %}<option value="{{ y }}" {% if y == year %}selected{% endif %}>{{ y }}</option>{% endfor %}
    </select>
  </label>
</form>
<section class="card">
  {% include "_leaderboard_table.html" %}
  <p class="muted small">Ranked by wins, then win %, then game difference, then presences.</p>
</section>
{% endblock %}
