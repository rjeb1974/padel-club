{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create account</h1>
  {% if first_user %}<p class="muted">You are the first user, so this account will be the admin.</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username <input name="username" required autofocus autocomplete="username"></label>
    <label>Display name <input name="name" required placeholder="e.g. Rui B."></label>
    <label>Password <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
    <label>Confirm password <input name="confirm" type="password" required minlength="8" autocomplete="new-password"></label>
    <button class="primary">Register</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
